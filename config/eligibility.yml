# Player eligibility thresholds.
# Source: USA Club Rugby Senior Club Regulations 2026-27 (§3.4.2, §3.5).
# See docs/adr/012-eligibility-for-any-number-of-sides.md.

# Reg 3.4.2(e): at least two NCS Qualifying matches with the club. Reg 3.5.2(a) applies it
# at a lower side's own level or below; Reg 3.5.2(b) at any level for the top side.
minimumMatches: 2

# Reg 3.5(d)(i): on playing a fourth match for any upper side, a player is no longer
# eligible for the lower side(s).
upperMatchLimit: 4

# Competitions that aren't NCS Qualifying Matches. League and local playoff matches count.
# Case-insensitive name fragments. Applied to the match record and to possible future
# matches; Super Regionals are also the deadline for reaching the two-match minimums.
nonQualifyingCompetitions:
  - "Super Regional"
  - "ASR "
  - "National Championships"
  - "7s"
  - "7's"
  - "Sevens"
  - "Friendly"
  - "Friendlies"
  - "Crossover"
