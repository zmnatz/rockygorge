# Built and served by Netlify's Next.js runtime, which saves .next/cache between builds
# (docs/adr/014-nextjs-runtime.md).
[build]
  command = "bun run build"
  publish = ".next"
  # Skips the build (exit 0) when nothing since the last one can change the site: the docs,
  # the tests and their config, CI and editor config, agent skills, and Markdown (pages are
  # .mdx). A build without cache has CACHED_COMMIT_REF equal to COMMIT_REF, which would look
  # like no change, so it always builds; so does any git error (exit 128).
  ignore = '''test "$CACHED_COMMIT_REF" != "$COMMIT_REF" && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ':!docs' ':!src/__tests__' ':!vitest.config.ts' ':!.github' ':!.husky' ':!.vscode' ':!.opencode' ':!LICENSE' ':!*.md' '''

[build.environment]
  NETLIFY_USE_BUN = "true"
  BUN_VERSION = "1.3.14"

# Declared, not left to Netlify to add: this site was a static export for years, and
# Netlify didn't add the runtime by itself, so every page was a 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"

