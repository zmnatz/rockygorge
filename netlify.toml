# Built and served by Netlify's Next.js runtime, which saves .next/cache between builds
# (docs/adr/014-nextjs-runtime.md).
[build]
  command = "bun run build"
  publish = ".next"

[build.environment]
  NETLIFY_USE_BUN = "true"
  BUN_VERSION = "1.3.14"

# Declared, not left to Netlify to add: this site was a static export for years, and
# Netlify didn't add the runtime by itself, so every page was a 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/api/calendar"
  to = "https://www.googleapis.com/calendar/v3/calendars/t1s0l2ucm1fl084olhmj69pme8@group.calendar.google.com/events"
  force = true
  status = 200
  headers = {X-goog-api-key = "AIzaSyDnoONpe29Y9gWIbhRKb_btifHo5X-d_Xo"}
