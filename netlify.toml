[build]
  command = "bun run build"
  publish = "build"

[build.environment]
  NETLIFY_USE_BUN = "true"
  BUN_VERSION = "1.3.14"

[[plugins]]
  package = "netlify-plugin-cache"

  [plugins.inputs]
    # .next/cache speeds up page prerendering. The generated snapshots
    # (public/data, public/crests, .cache/matches) are committed to the repo,
    # so they must NOT be cached here: a restored cache would overwrite the
    # fresher committed copies.
    paths = [".next/cache"]

# The eligibility report moved to the USA Club Rugby eligibility site
# (docs/adr/015-eligibility-on-its-own-site.md). Old links keep working: a club named in
# the query goes to that club's page there, and the rest to Rocky Gorge's.
[[redirects]]
  from = "/utils/eligibility"
  query = {club = ":club"}
  to = "https://usa-club-rugby-eligibility.netlify.app/club/:club/"
  status = 301
  force = true

[[redirects]]
  from = "/utils/eligibility"
  to = "https://usa-club-rugby-eligibility.netlify.app/club/rocky-gorge/"
  status = 301
  force = true

[[redirects]]
  from = "/utils/eligibility-methodology"
  to = "https://usa-club-rugby-eligibility.netlify.app/methodology/"
  status = 301
  force = true

[[redirects]]
  from = "/api/calendar"
  to = "https://www.googleapis.com/calendar/v3/calendars/t1s0l2ucm1fl084olhmj69pme8@group.calendar.google.com/events"
  force = true
  status = 200
  headers = {X-goog-api-key = "AIzaSyDnoONpe29Y9gWIbhRKb_btifHo5X-d_Xo"}

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
