# PR screenshots (the shared workflow in zmnatz/github-workflows, called from ci.yml). The
# home page is always captured. When a PR changes a file matching `files`, the listed routes are
# captured too. A route may add `waitFor` (selector) or `delayMs` for pages
# that fill in after load; the default is network idle plus a short settle.
rules:
  - files:
      - pages/gameday.tsx
      - src/components/MatchCentre/**
      - src/utils/gameday.ts
    routes:
      - path: /gameday
  - files:
      - src/components/Scores/**
      - src/api/scores.ts
    routes:
      - path: /gameday
  - files:
      - pages/standings.tsx
      - src/api/capital.ts
    routes:
      - path: /standings
  - files:
      - pages/calendar.mdx
    routes:
      - path: /calendar
  - files:
      - src/components/CalendarCard/**
    routes:
      - path: /
  - files:
      - pages/whereIsPractice.tsx
      - src/components/WhereIsPractice/**
    routes:
      - path: /whereIsPractice
  - files:
      - pages/api/calendar.ts
      - src/utils/calendarServer.ts
      - src/utils/calendar.ts
    routes:
      - path: /
      - path: /whereIsPractice
  - files:
      - content/links.yml
      - src/components/Toolbar.tsx
    routes:
      - path: /
  - files:
      - pages/player/**
      - src/utils/playerHistory.ts
      - src/utils/playerSnapshot.ts
    routes:
      - path: /player/f5JqeT4vzmH2nxtnR
