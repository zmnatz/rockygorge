name: Clean up PR screenshots

# Deletes a PR's folder from the orphan `pr-screenshots` branch when the PR closes or
# merges, so the branch does not grow forever. The job is the shared workflow in
# zmnatz/github-workflows.
on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    name: Remove PR screenshots
    uses: zmnatz/github-workflows/.github/workflows/screenshots-cleanup.yml@v1
    permissions:
      contents: write
