name: Deploy preview screenshots

# Screenshots a PR's Netlify deploy preview with Playwright, stores the images
# on the orphan `pr-screenshots` branch (so they can be embedded inline), and
# keeps one sticky comment on the PR up to date.
#
# Runs on every PR push: it waits for Netlify's `deploy/netlify` commit status
# to succeed and takes the preview URL from it. A `pull_request` workflow runs
# the file from the PR's own branch, so changes to this workflow can be tested
# on the PR that makes them. Can also be run by hand with a preview URL and PR
# number. Pages come from the PR description's `## Screenshots` section plus
# routes mapped from changed files (config/screenshots.yml); `/` is always
# included.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      preview_url:
        description: Deploy preview URL (e.g. https://deploy-preview-12--rockygorge.netlify.app)
        required: true
      pr_number:
        description: Pull request number
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: screenshots-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  screenshots:
    name: Screenshot preview
    # Same-repo PRs only: fork and Dependabot PRs get a read-only token.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      # Setup runs before the wait for Netlify below, so installing overlaps
      # with the deploy build instead of adding to the job's length.
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          # Empty on manual dispatch, which then uses the default branch.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Playwright version
        id: pw
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # The browser download is cached; the system libraries it needs are not.
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Chromium system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Resolve preview and PR
        id: ctx
        env:
          INPUT_URL: ${{ inputs.preview_url }}
          INPUT_PR: ${{ inputs.pr_number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          pr="${INPUT_PR:-$EVENT_PR}"
          sha=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
          url="${INPUT_URL%/}"
          if [ -z "$url" ]; then
            # Wait for Netlify to report the preview for this exact commit.
            for attempt in $(seq 1 60); do
              status=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/status" \
                --jq '[.statuses[] | select(.context == "deploy/netlify")][0] // empty | "\(.state) \(.target_url)"')
              state="${status%% *}"
              if [ -z "$status" ] && [ "$attempt" -ge 12 ]; then
                echo "No deploy/netlify status after 4 minutes. Netlify only builds previews for PRs that target the production branch (master); a stacked PR has none." >&2
                exit 1
              fi
              if [ "$state" = "success" ]; then
                url="${status#* }"
                url="${url%/}"
                break
              fi
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
                echo "Netlify deploy preview $state for $sha" >&2
                exit 1
              fi
              sleep 20
            done
          fi
          if [ -z "$url" ]; then
            echo "Timed out waiting for the Netlify deploy preview of $sha" >&2
            exit 1
          fi
          {
            echo "url=$url"
            echo "pr=$pr"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Read the PR description and changed files
        env:
          PR: ${{ steps.ctx.outputs.pr }}
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body -q .body > pr-body.md
          gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only > changed-files.txt

      - name: Take screenshots
        env:
          PREVIEW_URL: ${{ steps.ctx.outputs.url }}
        run: bun scripts/screenshots.ts --base-url "$PREVIEW_URL" --changed-files changed-files.txt --pr-body pr-body.md --out screenshots

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Publish images to the pr-screenshots branch
        if: always() && hashFiles('screenshots/report.json') != ''
        env:
          PR: ${{ steps.ctx.outputs.pr }}
          SHA: ${{ steps.ctx.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin pr-screenshots >/dev/null; then
            git fetch origin pr-screenshots
            git worktree add shots-branch origin/pr-screenshots --detach
          else
            git worktree add --orphan -b pr-screenshots shots-branch
          fi
          dir="shots-branch/pr-$PR/$SHA"
          mkdir -p "$dir"
          cp screenshots/*.png "$dir/"
          cd shots-branch
          git add -A
          git commit -m "Screenshots for PR $PR at $SHA" || true
          git push origin HEAD:pr-screenshots

      - name: Build the comment
        if: always() && hashFiles('screenshots/report.json') != ''
        env:
          PR: ${{ steps.ctx.outputs.pr }}
          SHA: ${{ steps.ctx.outputs.sha }}
        run: |
          bun scripts/screenshot-comment.ts \
            --report screenshots/report.json \
            --image-base-url "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/pr-screenshots/pr-$PR/$SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --sha "$SHA" \
            --out comment.md

      - name: Create or update the PR comment
        if: always() && hashFiles('comment.md') != ''
        env:
          PR: ${{ steps.ctx.outputs.pr }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- deploy-preview-screenshots -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          fi
