name: Deploy preview screenshots

# Screenshots a PR's Netlify deploy preview with Playwright, stores the images
# on the orphan `pr-screenshots` branch (so they can be embedded inline), and
# keeps one sticky comment on the PR up to date.
#
# Runs when Netlify reports a successful deploy preview (a `status` event from
# the deploy/netlify context whose URL starts with https://deploy-preview-), so
# it never waits on the deploy. Netlify posts commit statuses, not GitHub
# deployments, so `deployment_status` never fires here. Such workflows run from
# the default branch's copy of this file: changes here take effect once merged. Can also be run by hand with a preview
# URL and PR number. Pages come from the PR description's `## Screenshots`
# section plus routes mapped from changed files (playwright/config/screenshots.yml); `/`
# is always included.
on:
  status:
  workflow_dispatch:
    inputs:
      preview_url:
        description: Deploy preview URL (e.g. https://deploy-preview-12--rockygorge.netlify.app)
        required: true
      pr_number:
        description: Pull request number
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: screenshots-${{ inputs.pr_number || github.event.target_url }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  screenshots:
    name: Screenshot preview
    # Ignore production and branch deploys: only successful deploy previews.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.state == 'success' &&
       github.event.context == 'deploy/netlify' &&
       startsWith(github.event.target_url, 'https://deploy-preview-'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # Floating tag: the newest Playwright image, with Chromium and its
      # system libraries preinstalled. The repo does not pin a version for it.
      image: mcr.microsoft.com/playwright:noble
    steps:
      # The image lacks the GitHub CLI and git.
      - name: Install the GitHub CLI and git
        run: apt-get update -qq && apt-get install -y -qq gh git

      - name: Resolve preview and PR
        id: ctx
        env:
          INPUT_URL: ${{ inputs.preview_url }}
          INPUT_PR: ${{ inputs.pr_number }}
          EVENT_URL: ${{ github.event.target_url }}
        run: |
          url="${INPUT_URL:-$EVENT_URL}"
          url="${url%/}"
          pr="$INPUT_PR"
          if [ -z "$pr" ]; then
            pr=$(echo "$url" | sed -n 's#^https://deploy-preview-\([0-9]\+\)--.*#\1#p')
          fi
          if [ -z "$pr" ]; then
            echo "Could not work out the PR number from $url" >&2
            exit 1
          fi
          sha=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
          {
            echo "url=$url"
            echo "pr=$pr"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.sha }}
          sparse-checkout: playwright

      # Only the screenshot tooling's own dependencies, not the site's.
      - name: Install dependencies
        working-directory: playwright
        run: npm install --no-audit --no-fund --no-package-lock

      # A no-op when the image's browser build matches the Playwright version
      # installed above (npm can publish a release before the image catches up); otherwise it fetches just the matching Chromium.
      - name: Ensure the matching Chromium
        working-directory: playwright
        run: npx playwright-core install chromium

      - name: Read the PR description and changed files
        env:
          PR: ${{ steps.ctx.outputs.pr }}
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body -q .body > pr-body.md
          # Not `gh pr diff`, which fails above 300 files. This API returns up to
          # 3000, enough to map routes; the description can list any it misses.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' > changed-files.txt

      - name: Take screenshots
        env:
          PREVIEW_URL: ${{ steps.ctx.outputs.url }}
        run: node playwright/screenshots.ts --base-url "$PREVIEW_URL" --changed-files changed-files.txt --pr-body pr-body.md --out screenshots

      - name: Publish images to the pr-screenshots branch
        if: always() && hashFiles('screenshots/report.json') != ''
        env:
          PR: ${{ steps.ctx.outputs.pr }}
          SHA: ${{ steps.ctx.outputs.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin pr-screenshots >/dev/null; then
            git fetch origin pr-screenshots
            git worktree add shots-branch origin/pr-screenshots --detach
          else
            git worktree add --orphan -b pr-screenshots shots-branch
          fi
          dir="shots-branch/pr-$PR/$SHA"
          mkdir -p "$dir"
          cp screenshots/*.png "$dir/"
          cd shots-branch
          git add -A
          git commit -m "Screenshots for PR $PR at $SHA" || true
          git push origin HEAD:pr-screenshots

      - name: Build the comment
        if: always() && hashFiles('screenshots/report.json') != ''
        env:
          PR: ${{ steps.ctx.outputs.pr }}
          SHA: ${{ steps.ctx.outputs.sha }}
        run: |
          node playwright/screenshot-comment.ts \
            --report screenshots/report.json \
            --image-base-url "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/pr-screenshots/pr-$PR/$SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --sha "$SHA" \
            --out comment.md

      - name: Create or update the PR comment
        if: always() && hashFiles('comment.md') != ''
        env:
          PR: ${{ steps.ctx.outputs.pr }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- deploy-preview-screenshots -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          fi
