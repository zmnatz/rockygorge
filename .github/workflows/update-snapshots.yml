name: Update snapshots

# Refreshes the committed build-time JSON snapshots (public/data/**,
# .cache/leaders) so site builds can skip those CMS pulls. See docs/snapshots.md.
on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch: # manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    name: Update snapshots
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate snapshots (forced)
        run: bun run generate:force

      - name: Commit changes to master
        run: |
          git add public/data .cache/leaders
          if git diff --cached --quiet; then
            echo "Snapshots unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: nightly snapshot update"
          git push origin HEAD:master
