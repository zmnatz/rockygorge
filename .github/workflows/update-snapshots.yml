name: Update snapshots

# Refreshes the committed build-time JSON snapshots (public/data/**,
# public/crests, .cache/matches) so site builds can skip those CMS pulls. See docs/snapshots.md.
on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch: # manual run from the Actions tab

permissions:
  contents: write

concurrency: update-snapshots

jobs:
  update:
    name: Update snapshots
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Each job keeps its previous snapshot if it fails, so the others still run
      # and their updates are committed. A failed job fails the run at the end,
      # which is what makes GitHub send its failure notification.
      - name: Regenerate snapshots (forced)
        id: regenerate
        run: |
          failed=""
          for job in scores standings players leaders club-pages crests; do
            FORCE_SNAPSHOTS=1 bun run "generate:$job" || failed="$failed $job"
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Commit changes to master
        run: |
          git add public/data public/crests .cache
          if git diff --cached --quiet; then
            echo "Snapshots unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: nightly snapshot update"
          # master may have moved during the regeneration
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Fail if a snapshot job failed
        if: steps.regenerate.outputs.failed != ''
        run: |
          echo "::error::Snapshot jobs failed:${{ steps.regenerate.outputs.failed }}. Their previous data was kept."
          exit 1
