name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          prompt: |
            Load the "code-review" skill and use its process to review this pull request.

            Fixed point for the diff: ${{ github.event.pull_request.base.sha }}
            Run the review against `git diff <fixed-point>...HEAD`.

            There is no interactive user here, so follow the skill's process with these adjustments:
            - The spec source is the PR description and any linked issues.
            - If no spec can be found, skip the Spec axis and report "no spec available".
            - Do not ask the user anything; post your aggregated report as the review comment.
