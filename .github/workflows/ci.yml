name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Run tests
        run: bun run test

      # Netlify builds every PR's deploy preview, so CI only type-checks.
      - name: Type-check
        run: bun run typecheck

  # Builds the site, serves it with `next start` (as Netlify's runtime does) and
  # screenshots it, then keeps one sticky comment on the PR up to date, so it doesn't
  # wait on or depend on Netlify's deploy preview. The job is the shared workflow in
  # zmnatz/code-review, which stores the images on the orphan `pr-screenshots` branch
  # so they can be embedded inline. Pages come from the PR description's
  # `## Screenshots` section plus routes mapped from changed files
  # (.github/screenshots/rules.yml); `/` is always included.
  screenshots:
    name: Screenshots
    # A fork's token can't push the images or comment.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: zmnatz/code-review/.github/workflows/screenshots.yml@v1
    permissions:
      contents: write
      pull-requests: write
    with:
      rules: .github/screenshots/rules.yml
      noise: .github/screenshots/noise.yml
      bun-version: 1.3.14
